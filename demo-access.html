<!DOCTYPE html>
<html lang="en" x-data="demoAccess()" x-init="init()" :class="{'dark':dark}" class="scroll-smooth">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Try Live Demo — Mian Sabokh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500&display=swap" rel="stylesheet"/>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{display:['PT Sans','sans-serif'],body:['DM Sans','sans-serif']},colors:{accent:'#FF6B2B','accent-light':'#FF8F5C'}}}}</script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{font-family:'DM Sans',sans-serif;}
    h1,h2,h3{font-family:'PT Sans',sans-serif;}
    body{transition:background-color .3s,color .3s;}
    .reveal{opacity:0;transform:translateY(18px);transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1);}
    .reveal.in{opacity:1;transform:none;}
    .otp-box{width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#FF6B2B;border-radius:99px;}
  </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-body antialiased min-h-screen flex flex-col">

  <header class="border-b border-zinc-100 dark:border-zinc-900">
    <nav class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="font-display font-bold text-xl tracking-tight"><span class="text-accent">Mian</span> Sabokh</a>
      <a href="projects.html" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-accent transition-colors">&larr; All Projects</a>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-md">

      <!-- Loading project info -->
      <template x-if="loadingProject">
        <p class="text-center text-sm text-zinc-400">Loading demo…</p>
      </template>

      <!-- Unknown project -->
      <template x-if="!loadingProject && !project">
        <div class="reveal in text-center">
          <h1 class="font-display font-bold text-2xl mb-3">Demo not available</h1>
          <p class="text-zinc-500 dark:text-zinc-400 mb-6">We couldn't find a live demo for this project.</p>
          <a href="projects.html" class="inline-flex items-center gap-2 bg-accent text-white font-medium px-6 py-3 rounded-full hover:bg-accent-light transition-colors">View All Projects &rarr;</a>
        </div>
      </template>

      <template x-if="!loadingProject && project">
        <div class="reveal in">

          <div class="text-center mb-8">
            <p class="text-xs font-medium text-accent tracking-widest uppercase mb-2">Live Demo</p>
            <h1 class="font-display font-bold text-3xl text-zinc-900 dark:text-white mb-2" x-text="project.name"></h1>
            <p class="text-sm text-zinc-500 dark:text-zinc-400" x-text="project.description"></p>
          </div>

          <div class="border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 sm:p-8">

            <!-- STEP 1: email -->
            <template x-if="step === 'email'">
              <div>
                <h2 class="font-display font-bold text-lg mb-1">Try Live Demo</h2>
                <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-5">Enter your email to receive a verification code.</p>
                <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Email address</label>
                <input type="email" x-model="email" placeholder="you@example.com"
                  class="w-full border border-zinc-200 dark:border-zinc-700 bg-transparent rounded-xl px-4 py-3 text-sm mb-2 focus:outline-none focus:border-accent transition-colors">
                <p class="text-xs text-red-500 mb-3 min-h-[1rem]" x-text="error"></p>
                <button @click="requestCode()" :disabled="sending"
                  class="w-full bg-accent text-white font-medium px-6 py-3 rounded-full hover:bg-accent-light transition-colors disabled:opacity-50">
                  <span x-show="!sending">Send Verification Code</span>
                  <span x-show="sending">Sending…</span>
                </button>
                <p class="text-xs text-zinc-400 mt-4 leading-relaxed">Your email is used only to verify demo access and is not used to create a permanent account.</p>
              </div>
            </template>

            <!-- STEP 2: otp -->
            <template x-if="step === 'otp'">
              <div>
                <h2 class="font-display font-bold text-lg mb-1">Verification code sent</h2>
                <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-5">Enter the 6-digit code sent to <span class="font-medium text-zinc-700 dark:text-zinc-300" x-text="email"></span>.</p>
                <input type="text" inputmode="numeric" maxlength="6" x-model="code" placeholder="••••••"
                  class="otp-box w-full tracking-[0.5em] border border-zinc-200 dark:border-zinc-700 bg-transparent rounded-xl px-4 py-3 mb-2 focus:outline-none focus:border-accent transition-colors">
                <p class="text-xs text-red-500 mb-3 min-h-[1rem]" x-text="error"></p>
                <button @click="verifyCode()" :disabled="verifying"
                  class="w-full bg-accent text-white font-medium px-6 py-3 rounded-full hover:bg-accent-light transition-colors disabled:opacity-50">
                  <span x-show="!verifying">Verify & Start Demo</span>
                  <span x-show="verifying">Verifying…</span>
                </button>
                <div class="flex justify-between items-center mt-4">
                  <button @click="step='email'; code=''; error=''" class="text-xs text-zinc-400 hover:text-accent transition-colors">&larr; Use a different email</button>
                  <button @click="requestCode()" :disabled="sending" class="text-xs text-zinc-400 hover:text-accent transition-colors">Resend code</button>
                </div>
              </div>
            </template>

            <!-- STEP 3: launching -->
            <template x-if="step === 'launching'">
              <div class="text-center py-6">
                <p class="font-display font-bold text-lg mb-1">Starting your demo…</p>
                <p class="text-sm text-zinc-500 dark:text-zinc-400">This will only take a second.</p>
              </div>
            </template>

          </div>

          <p class="text-center text-xs text-zinc-400 mt-6">Your demo session is temporary and will automatically expire.</p>
        </div>
      </template>

    </div>
  </main>

  <footer class="border-t border-zinc-100 dark:border-zinc-900">
    <div class="max-w-3xl mx-auto px-6 py-6 text-center">
      <p class="text-xs text-zinc-400">&copy; <span id="year"></span> Mian Sabokh. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // ── ONE place to point this whole page at your backend ──
    const API_BASE = "http://localhost:3000/api/demo";

    function demoAccess() {
      return {
        dark: false,
        loadingProject: true,
        project: null,
        projectSlug: new URLSearchParams(location.search).get("project"),
        step: "email",
        email: "",
        code: "",
        error: "",
        sending: false,
        verifying: false,

        async init() {
          this.dark = localStorage.getItem('theme') === 'dark'
            || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.getElementById('year').textContent = new Date().getFullYear();

          if (!this.projectSlug) { this.loadingProject = false; return; }
          try {
            const res = await fetch(`${API_BASE}/project/${this.projectSlug}`);
            if (res.ok) this.project = await res.json();
          } catch (e) { /* leave project null -> "not available" view */ }
          this.loadingProject = false;
        },

        async requestCode() {
          this.error = "";
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.email)) {
            this.error = "Enter a valid email address.";
            return;
          }
          this.sending = true;
          try {
            const res = await fetch(`${API_BASE}/request-code`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: this.email, project: this.projectSlug }),
            });
            const data = await res.json();
            if (!res.ok) { this.error = data.error || "Something went wrong."; return; }
            this.step = "otp";
          } catch (e) {
            this.error = "Network error. Please try again.";
          } finally {
            this.sending = false;
          }
        },

        async verifyCode() {
          this.error = "";
          if (!this.code || this.code.length !== 6) {
            this.error = "Enter the 6-digit code.";
            return;
          }
          this.verifying = true;
          try {
            const res = await fetch(`${API_BASE}/verify-code`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: this.email, project: this.projectSlug, code: this.code }),
            });
            const data = await res.json();
            if (!res.ok) { this.error = data.error || "Incorrect code."; return; }

            this.step = "launching";
            const url = `demo-apps/${data.appFile}?session=${data.sessionId}`;
            setTimeout(() => { location.href = url; }, 600);
          } catch (e) {
            this.error = "Network error. Please try again.";
          } finally {
            this.verifying = false;
          }
        },
      };
    }
  </script>
</body>
</html>
